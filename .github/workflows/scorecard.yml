name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 4 * * 1'
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    # Scorecard needs its scopes on the calling job (reusable workflows cannot
    # widen the caller's permission ceiling).
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    uses: eclipse-fennec/.github/.github/workflows/reusable-scorecard.yml@11841b15484440c9d03982aa33cf1188a2fa2e83 # v1.2.0
