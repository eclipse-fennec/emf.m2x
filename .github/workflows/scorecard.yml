name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 4 * * 1'
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    # Scorecard needs its scopes on the calling job (reusable workflows cannot
    # widen the caller's permission ceiling).
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    uses: eclipse-fennec/.github/.github/workflows/reusable-scorecard.yml@5a1a919f7f7ca9dd4c13cbeb5bca6735c4d8ecb7 # v1.2.1
