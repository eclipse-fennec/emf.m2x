name: Snapshot Build

# Orchestrator for the snapshot branch (development branch -> Maven Snapshot).
#
# verify and release come from the central reusables in eclipse-fennec/.github;
# the Pages part stays repo-local because the central set knows nothing about p2
# and emf.m2x publishes the p2 update site and the docs in a single deploy
# (see pages-deploy.yml for why).
#
# The p2 update site is republished from the *exact* jar built by the release job
# (artifact `release-jars`), never rebuilt.
on:
  push:
    # This snapshot build should only happen on pushes to the snapshot branch.
    branches:
      - snapshot
  pull_request:
    # This snapshot build should NOT happen on pull requests.
    branches-ignore:
      - '*'

permissions:
  contents: read
  pages: write # Pages deploy
  id-token: write # OIDC token for the Pages deployment
  actions: read # pages-deploy restores the previous site-full artifact

# Serialize Pages publishing; let an in-flight deploy finish before the next.
concurrency:
  group: snapshot-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@9292fbff296548018fa9e4b0f6ad49ba7c639501 # v1.1.1
    with:
      # java-versions unset on purpose: the reusable default '["21","25"]' runs
      # both legs. m2x still targets Java 21; the 25 leg is a toolchain check.
      # perfTest runs our own performance tests. Since #88 it no longer sets
      # ignoreFailures, so a failure is a failure, and since #87 it takes ~38 s in
      # CI — there is nothing left to keep it out for. The comparison against the
      # Eclipse implementations is @Tag("benchmark") and has its own task, which no
      # workflow invokes.
      run-perf-tests: true

  release:
    name: Release snapshot
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
    with:
      do-release: false
      # The p2 repository jar is produced by the normal build (-export: type=p2
      # in ocl.ide.p2/bnd.bnd), so no extra Gradle task is needed - only the
      # upload, so the p2 job can reuse this build's jar.
      artifact-paths: org.eclipse.fennec.m2x.ocl.ide.p2/generated/org.eclipse.fennec.m2x.ocl.p2.jar
    secrets: inherit

  p2:
    name: Assemble p2 update site
    needs: release
    uses: ./.github/workflows/p2-pages.yml
    with:
      branch: snapshot

  docs:
    name: Assemble documentation site
    uses: ./.github/workflows/docs-pages.yml
    with:
      branch: snapshot

  deploy:
    name: Deploy to GitHub Pages
    needs: [p2, docs]
    uses: ./.github/workflows/pages-deploy.yml
    with:
      channel: snapshot
