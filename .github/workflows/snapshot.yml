name: Snapshot Build

# Orchestrator for the snapshot branch (development branch -> Maven Snapshot).
#
# verify, release and the docs build all come from the central reusables in
# eclipse-fennec/.github. The docs one runs in *slice* mode (deploy: false): the
# central set knows nothing about p2, and emf.m2x publishes the p2 update site and
# the docs in a single deploy, so assembling and deploying the Pages site stays
# repo-local (see pages-deploy.yml for why).
#
# The p2 update site is republished from the *exact* jar built by the release job
# (artifact `release-jars`), never rebuilt.
on:
  push:
    # This snapshot build should only happen on pushes to the snapshot branch.
    branches:
      - snapshot
  pull_request:
    # This snapshot build should NOT happen on pull requests.
    branches-ignore:
      - '*'

permissions:
  contents: read
  pages: write # Pages deploy
  id-token: write # OIDC token for the Pages deployment
  actions: read # pages-deploy restores the previous site-full artifact

# Serialize Pages publishing; let an in-flight deploy finish before the next.
concurrency:
  group: snapshot-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@11841b15484440c9d03982aa33cf1188a2fa2e83 # v1.2.0
    with:
      # java-versions unset on purpose: the reusable default '["21","25"]' runs
      # both legs. m2x still targets Java 21; the 25 leg is a toolchain check.
      # perfTest runs our own performance tests. Since #88 it no longer sets
      # ignoreFailures, so a failure is a failure, and since #87 it takes ~38 s in
      # CI — there is nothing left to keep it out for. The comparison against the
      # Eclipse implementations is @Tag("benchmark") and has its own task, which no
      # workflow invokes.
      run-perf-tests: true

  release:
    name: Release snapshot
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@11841b15484440c9d03982aa33cf1188a2fa2e83 # v1.2.0
    with:
      do-release: false
      # The p2 repository jar is produced by the normal build (-export: type=p2
      # in ocl.ide.p2/bnd.bnd), so no extra Gradle task is needed - only the
      # upload, so the p2 job can reuse this build's jar.
      artifact-paths: org.eclipse.fennec.m2x.ocl.ide.p2/generated/org.eclipse.fennec.m2x.ocl.p2.jar
    secrets: inherit

  p2:
    name: Assemble p2 update site
    needs: release
    uses: ./.github/workflows/p2-pages.yml
    with:
      branch: snapshot

  docs:
    name: Assemble documentation site
    # Central VitePress build, in slice mode: `deploy: false` uploads
    # `site/snapshot/` as the `pages-docs` artifact instead of publishing, which
    # is what this repo needs — a Pages deploy replaces the ENTIRE site and we
    # publish the p2 update site next to the docs, so only pages-deploy.yml may
    # deploy. It also gates the build on the shared docs theme (Eclipse Foundation
    # footer, brand palette) matching eclipse-fennec/.github's docs-theme/.
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@11841b15484440c9d03982aa33cf1188a2fa2e83 # v1.2.0
    with:
      deploy: false
      # `latest`/`snapshot` is a URL segment, not necessarily the ref name:
      # release.yml runs on `main` but publishes the `latest` channel.
      version: snapshot
      # The name pages-deploy.yml globs as `pages-*`.
      slice-artifact: pages-docs

  deploy:
    name: Deploy to GitHub Pages
    needs: [p2, docs]
    uses: ./.github/workflows/pages-deploy.yml
    with:
      channel: snapshot

  test-report:
    name: Render test results
    needs: verify
    # Render whatever `verify` produced, red or green — a failing run is exactly
    # when the per-test annotations are worth having.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/test-report.yml
    # java-versions deliberately unset: it defaults to the same '["21","25"]' as
    # reusable-verify, so the two stay in step.
