name: SBOM & Vulnerability Scan

# Writes the SBOMs of the m2x applications (`./gradlew sbom`: required.bndrun = all engines,
# ocl.feature.bndrun = content of the OCL p2 repository) and scans them with Trivy.
#
# The SBOM describes the resolved OSGi application (-runbundles plus framework), not the build
# tools; see cnf/sbom/plugin.bnd and the sbom tasks in build.gradle.
#
# Gate: the job fails on HIGH or CRITICAL vulnerabilities for which a fixed version exists
# (--ignore-unfixed). Everything else is reported (job summary, artifact) without failing.

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
      - snapshot
  # New vulnerabilities are published without any change on our side.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  SBOMS: >-
    org.eclipse.fennec.m2x.library.workspace/generated/sbom/required.bndrun.cdx.json
    org.eclipse.fennec.m2x.ocl.ide.p2/generated/sbom/ocl.feature.bndrun.cdx.json

jobs:
  sbom:
    name: SBOM and Trivy scan
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Build bundles and write SBOMs
        run: ./gradlew --no-daemon assemble sbom

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Scan SBOMs (full report)
        run: |
          mkdir -p trivy
          {
            echo "## Trivy scan of the m2x SBOMs"
            echo
            echo "Gate: HIGH/CRITICAL with a fixed version. All findings below, all severities."
          } >> "$GITHUB_STEP_SUMMARY"
          for sbom in $SBOMS; do
            name="$(basename "$sbom" .cdx.json)"
            trivy sbom --quiet --format json --output "trivy/${name}.trivy.json" "$sbom"
            {
              echo
              echo "### ${name}"
              echo
              echo '```'
              trivy sbom --quiet --format table "$sbom"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload SBOMs and Trivy reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            */generated/sbom/*.cdx.json
            trivy/*.json
          if-no-files-found: warn

      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        run: |
          status=0
          for sbom in $SBOMS; do
            trivy sbom --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$sbom" || status=1
          done
          exit "$status"
