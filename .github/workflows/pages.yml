name: Publish p2 update sites

# Builds the Fennec p2 update site(s) and publishes them to this repository's
# GitHub Pages, under https://eclipse-fennec.github.io/emf.m2x/<component>/<branch>/p2/.
#
# Pre-release model: all code currently lives on the `snapshot` branch, so the
# deploy runs from there. Once `snapshot` is merged into `main` for the first
# release, `main` becomes the authoritative assembler (it then also builds the
# `latest` alias and pulls the other branches' p2 from their build artifacts).
on:
  push:
    branches:
      - snapshot
  workflow_dispatch:

env:
  LC_ALL: en_US.UTF-8
  GRADLE_OPTS: >-
    -Dorg.gradle.parallel=true

defaults:
  run:
    shell: bash

# Serialize Pages publishing; let an in-flight deploy finish before the next.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege: jobs opt in to what they need.
permissions: {}

jobs:
  build:
    name: Build p2 update sites
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          cache: "gradle"
          java-version: 21
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build OCL p2 repository
        # --rerun-tasks defeats the Gradle cache so the export is never skipped;
        # -dependson in the p2 project pulls model/api/parser/engine/ide first.
        run: ./gradlew :org.eclipse.fennec.m2x.ocl.ide.p2:export --rerun-tasks
      - name: Assemble Pages site
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          site="_site"
          rm -rf "$site"
          mkdir -p "$site"
          # Disable Jekyll (not used by the workflow Pages build, but harmless insurance).
          touch "$site/.nojekyll"

          # OCL update site -> <component>/<branch>/p2/
          ocl_p2="org.eclipse.fennec.m2x.ocl.ide.p2/generated/org.eclipse.fennec.m2x.ocl.p2.jar"
          test -f "$ocl_p2"
          mkdir -p "$site/ocl/${branch}/p2"
          unzip -q -o "$ocl_p2" -d "$site/ocl/${branch}/p2"

          # QVT and M2T update sites will be added here once they have p2 projects:
          #   $site/qvt/${branch}/p2/   and   $site/m2t/${branch}/p2/

          # Minimal landing page (served at https://eclipse-fennec.github.io/emf.m2x/).
          cat > "$site/index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>Fennec M2X &mdash; Eclipse update sites</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:42rem;margin:3rem auto;padding:0 1rem}code{background:#f3f3f3;padding:.1em .3em;border-radius:3px}</style>
          <h1>Fennec M2X &mdash; Eclipse update sites</h1>
          <p>Add these URLs in Eclipse via <em>Help &rarr; Install New Software&hellip; &rarr; Add&hellip;</em>.</p>
          <ul>
            <li><strong>OCL (${branch})</strong>:
              <code>https://eclipse-fennec.github.io/emf.m2x/ocl/${branch}/p2/</code>
              &mdash; <a href="ocl/${branch}/p2/">browse</a></li>
          </ul>
          <p>See the <a href="https://github.com/eclipse-fennec/emf.m2x">project repository</a> for documentation.</p>
          HTML

          echo "Assembled site:"; find "$site" -maxdepth 3 -type d | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # OIDC token for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
