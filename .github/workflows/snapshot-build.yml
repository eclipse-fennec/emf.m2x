name: Gradle build (reusable)

# Reusable build: runs the Gradle release (snapshot or real release, controlled by
# `do-release`) and publishes the OCL p2 repository jar as a build artifact so a
# downstream job can republish *exactly* that jar without rebuilding it.
on:
  workflow_call:
    inputs:
      do-release:
        description: "true for a tagged release, false for a snapshot"
        type: boolean
        default: false

env:
  LC_ALL: en_US.UTF-8
  GRADLE_OPTS: >-
    -Dorg.gradle.parallel=true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CS_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
      CS_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      DO_RELEASE: ${{ inputs.do-release }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          cache: "gradle"
          java-version: 21
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Gradle version
        run: ./gradlew --no-daemon --version
      - name: Setup GPG and jp environment
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg2 jp
          echo "$GPG_PRIVATE_KEY" > private.key
          echo "$GPG_PASSPHRASE" | gpg --batch --passphrase-fd 0 --pinentry-mode loopback --no-tty --quiet --yes --import private.key
          rm private.key
      - name: Build with Gradle
        run: ./gradlew release
      - name: Verify p2 jar
        run: test -f org.eclipse.fennec.m2x.ocl.ide.p2/generated/org.eclipse.fennec.m2x.ocl.p2.jar
      - name: Upload OCL p2 jar
        uses: actions/upload-artifact@v4
        with:
          name: ocl-p2
          path: org.eclipse.fennec.m2x.ocl.ide.p2/generated/org.eclipse.fennec.m2x.ocl.p2.jar
          if-no-files-found: error
      - name: Delete GPG key from keyring
        if: always()
        run: rm -rf ~/.gnupg
