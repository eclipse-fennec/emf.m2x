name: CI Build

on:
  push:
    # Verify on every branch EXCEPT main and snapshot (those release/publish via
    # their dedicated orchestrators). All other branches only verify.
    branches-ignore:
      - main
      - snapshot
  pull_request:
    branches:
      - '*'

# Least privilege by default; verification only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@9292fbff296548018fa9e4b0f6ad49ba7c639501 # v1.1.1
    with:
      # java-versions is deliberately not set: the reusable default is
      # '["21","25"]' and both legs are wanted. m2x still *targets* 21
      # (javac.source/target in cnf/build.bnd, -runee JavaSE-21), so the JDK 25
      # leg checks that the toolchain builds under 25 while the artifacts stay
      # Java 21 bytecode.
      #
      # perfTest runs the heavy, informational (@Tag("perf")) benchmarks. They
      # set ignoreFailures, so they carry no gate signal and just add ~25 min.
      run-perf-tests: false
