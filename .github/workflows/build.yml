name: CI Build

on:
  push:
    # Verify on every branch EXCEPT main and snapshot (those release/publish via
    # their dedicated orchestrators). All other branches only verify.
    branches-ignore:
      - main
      - snapshot
  pull_request:
    branches:
      - '*'

# Least privilege by default; verification only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@9292fbff296548018fa9e4b0f6ad49ba7c639501 # v1.1.1
    with:
      # m2m is a Java 21 project; the JDK 25 matrix leg can be enabled later
      # (drop this input to use the reusable default '["21","25"]') once the
      # EMF/bnd/ANTLR toolchain is verified against JDK 25.
      java-versions: '["21"]'
      # perfTest runs the heavy, informational (@Tag("perf")) benchmarks. They
      # were never part of m2m CI and just slow every PR down; keep them out of
      # the per-PR verify (run them manually / on a dedicated job when needed).
      run-perf-tests: false
