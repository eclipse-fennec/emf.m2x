name: CI Build

on:
  push:
    # Verify on every branch EXCEPT main and snapshot (those release/publish via
    # their dedicated orchestrators). All other branches only verify.
    branches-ignore:
      - main
      - snapshot
  pull_request:
    branches:
      - '*'

# Least privilege by default; verification only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@11841b15484440c9d03982aa33cf1188a2fa2e83 # v1.2.0
    with:
      # java-versions is deliberately not set: the reusable default is
      # '["21","25"]' and both legs are wanted. m2x still *targets* 21
      # (javac.source/target in cnf/build.bnd, -runee JavaSE-21), so the JDK 25
      # leg checks that the toolchain builds under 25 while the artifacts stay
      # Java 21 bytecode.
      #
      # perfTest runs our own performance tests (@Tag("perf")). It used to take
      # ~25 min and was kept out for that reason, but 92% of it was one test
      # measuring the quadratic set build fixed in #87 — it is ~30 s now, and it
      # fails on a real failure since the tag split (#88). The comparison against
      # the Eclipse implementations is @Tag("benchmark") and has its own task,
      # which no workflow invokes.
      run-perf-tests: true

  test-report:
    name: Render test results
    needs: verify
    # Render whatever `verify` produced, red or green — a failing run is exactly
    # when the per-test annotations are worth having.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/test-report.yml
    # java-versions deliberately unset: it defaults to the same '["21","25"]' as
    # reusable-verify, so the two stay in step.
