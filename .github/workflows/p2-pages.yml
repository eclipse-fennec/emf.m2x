name: Assemble p2 update sites (reusable)

# Reusable: turns the built OCL p2 jar into a Pages *slice* under
# <component>/<branch>/p2/ and uploads it as a regular artifact (`pages-ocl`).
# It deliberately does NOT deploy: GitHub Pages replaces the whole site on every
# deploy, so a single orchestrator deploy job merges all `pages-*` slices (p2 and
# the documentation site) and publishes once - see pages-deploy.yml.
on:
  workflow_call:
    inputs:
      branch:
        description: "branch/version segment in the URL, e.g. snapshot or latest"
        required: true
        type: string
      artifact-name:
        description: "artifact holding the p2 jar; reusable-release.yml uploads it as release-jars"
        required: false
        type: string
        default: release-jars

defaults:
  run:
    shell: bash

jobs:
  assemble:
    name: Assemble OCL p2 slice
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Download OCL p2 jar
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: p2-in
      - name: Assemble p2 slice
        run: |
          set -euo pipefail
          branch="${{ inputs.branch }}"
          out="site"
          rm -rf "$out"
          # OCL update site -> <component>/<branch>/p2/
          dir="$out/ocl/${branch}/p2"
          mkdir -p "$dir"
          unzip -q -o p2-in/org.eclipse.fennec.m2x.ocl.p2.jar -d "$dir"
          # Human-readable info page so the URL shows a real page (not a 404 /
          # directory listing) in a browser and in Eclipse's repository view.
          p2url="https://eclipse-fennec.github.io/emf.m2x/ocl/${branch}/p2/"
          sed -e "s|__BRANCH__|${branch}|g" -e "s|__P2_URL__|${p2url}|g" \
            org.eclipse.fennec.m2x.ocl.ide.p2/p2-index.template.html > "$dir/index.html"
          # QVT/M2T slices will be added here once they have p2 projects:
          #   $out/qvt/${branch}/p2/   and   $out/m2t/${branch}/p2/
          echo "p2 slice:"; find "$out" -type f | sort
      - name: Upload p2 slice
        uses: actions/upload-artifact@v4
        with:
          name: pages-ocl
          path: site
          if-no-files-found: error
