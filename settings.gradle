pluginManagement {
  plugins {
    id 'biz.aQute.bnd.workspace' version bnd_version
  }
  repositories {
    maven {
      url = uri(bnd_snapshots)
      content {
        snapshotsOnly()
        includeGroup('biz.aQute.bnd')
        includeGroup('biz.aQute.bnd.workspace')
      }
    }
    mavenCentral()
    gradlePluginPortal()
  }

  // Must run before the bnd workspace plugin below: applying it reads every bnd.bnd,
  // and the benchmark projects reference their Eclipse dependencies as files on the
  // -testpath. See the script for why they are files and not a bnd repository.
  apply from: "$rootDir/gradle/benchmark-dependencies.gradle"
}
plugins {
  id 'biz.aQute.bnd.workspace'
}
rootProject.name = "fennec-m2x"

// Exclude non-standard projects from Gradle build
def excludedProjects = [
  'docs',                                          // documentation, not build targets
  'tools',                                         // shell scripts, nothing to compile or jar
] as Set
excludedProjects.addAll(gradle.benchmarkProjectsWithoutDependencies)

gradle.beforeProject { project ->
  if (project.name in excludedProjects) {
    project.tasks.configureEach { task ->
      task.enabled = false
    }
  }
}
