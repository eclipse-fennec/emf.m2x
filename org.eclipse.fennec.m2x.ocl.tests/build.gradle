jacocoTestReport {
    additionalClassDirs(files(
        "${rootProject.projectDir}/org.eclipse.fennec.m2x.ocl.engine/bin",
        "${rootProject.projectDir}/org.eclipse.fennec.m2x.ocl.parser/bin"
    ))
    additionalSourceDirs(files(
        "${rootProject.projectDir}/org.eclipse.fennec.m2x.ocl.engine/src",
        "${rootProject.projectDir}/org.eclipse.fennec.m2x.ocl.parser/src"
    ))
}

def resolveTask = tasks.named("resolve.test") {
	outputBndrun = layout.buildDirectory.file("test.bndrun")
}

tasks.named("testOSGi") {
	bndrun = resolveTask.flatMap { it.outputBndrun }
}

// #435: resolve the engine with `effective:=active` requirements honoured, as downstream
// bndruns do, so a service required via DS but provided without a capability fails here.
// Written to build/, the checked-in bndrun stays without -runbundles.
def resolveActiveTask = tasks.named("resolve.resolve-active") {
	outputBndrun = layout.buildDirectory.file("resolve-active.bndrun")
}

tasks.named("check") {
	dependsOn resolveActiveTask
}
